<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>CUSTOM TTA MANAGER</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="login-page">

<div class="login-box">

<h1>CUSTOM TTA</h1>

<p>Manager System</p>

<input
id="username"
type="text"
placeholder="Tên đăng nhập">

<input
id="password"
type="password"
placeholder="Mật khẩu">

<button
onclick="login()">

ĐĂNG NHẬP

</button>

<div id="loginError"></div>

</div>

</div>

<!-- APP -->

<div id="app" class="hidden">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">

CUSTOM TTA

</div>

<div
class="menu-item active"

onclick="openPage('dashboard')">

🏠 Dashboard

</div>

<div
class="menu-item"

onclick="openPage('slot')">

🎮 Slot

</div>

<div
class="menu-item"

onclick="openPage('payment')">

💸 Thanh toán

</div>

<div
class="menu-item"

onclick="openPage('balance')">

💰 Danh sách dư

</div>

<div
class="menu-item"

onclick="openPage('salary')">

📊 Lương

</div>

<div
class="menu-item"

onclick="openPage('ctv')">

👥 CTV

</div>

<div
class="menu-item"

onclick="openPage('setting')">

⚙️ Cài đặt

</div>

<div
class="menu-item"

onclick="logout()">

🚪 Đăng xuất

</div>

</div>

<!-- CONTENT -->

<div class="content">

<!-- TOPBAR -->

<div class="topbar">

<button
class="mobile-toggle"
onclick="TTA.mobile.toggleMenu()">

☰

</button>

<div>

<span id="welcomeUser">

Xin chào

</span>

</div>

<div>

<span id="clock"></span>

</div>

</div>

<!-- DASHBOARD -->

<div
id="dashboard"
class="page">

<h2>Dashboard</h2>

<div class="card-grid">

<div class="card">

<h3>Tổng Slot</h3>

<span id="totalSlot">0</span>

</div>

<div class="card">

<h3>Đã Full</h3>

<span id="fullSlot">0</span>

</div>

<div class="card">

<h3>Khách</h3>

<span id="totalPlayer">0</span>

</div>

<div class="card">

<h3>CTV</h3>

<span id="totalCTV">0</span>

</div>

</div>

</div>

<!-- SLOT -->

<div
id="slot"
class="page hidden">

<h2>Quản lý Slot</h2>

</div>

<!-- PAYMENT -->

<div
id="payment"
class="page hidden">

<h2>Thanh toán</h2>

</div>

<!-- BALANCE -->

<div
id="balance"
class="page hidden">

<h2>Danh sách dư</h2>

</div>

<!-- SALARY -->

<div
id="salary"
class="page hidden">

<h2>Bảng lương</h2>

</div>

<!-- CTV -->

<div
id="ctv"
class="page hidden">

<h2>Quản lý CTV</h2>

</div>

<!-- SETTING -->

<div
id="setting"
class="page hidden">

<h2>Cài đặt</h2>
<button
id="installApp"
style="display:none"
onclick="installPWA()">

📱 Cài ứng dụng

</button>
</div>

</div>

</div>

<script src="config.js"></script>

<script src="database.js"></script>

<script src="utils.js"></script>

<script src="app.js"></script>

<script src="auth.js"></script>

<script src="permission.js"></script>

<script src="slot.js"></script>

<script src="slot_generator.js"></script>

<script src="payment.js"></script>

<script src="salary.js"></script>

<script src="team.js"></script>

<script src="notification.js"></script>

<script src="backup.js"></script>

<script src="export.js"></script>

<script src="mobile.js"></script>

<script src="security.js"></script>

<script src="firebase.js"></script>

<script src="messenger.js"></script>

</body>

</html>
