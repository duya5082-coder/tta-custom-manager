<script>


const welcome =
document.getElementById("welcome");


const manager =
document.getElementById("manager");



manager.style.display="none";

.getElementById("startBtn")
.onclick=function(){

.getElementById(id)
.scrollIntoView({

behavior:"smooth"

});


}
