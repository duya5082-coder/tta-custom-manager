<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
🔥 CUSTOM TTA MANAGER
</title>


<meta name="theme-color" content="#ff6a00">


<link rel="manifest" href="manifest.json">


<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="mobile.css">


</head>


<body>


<!-- LOADING -->

<div id="loading">

<h1>
🔥 CUSTOM TTA
</h1>

<p>
Đang khởi động hệ thống...
</p>

</div>





<!-- LOGIN -->

<section id="loginPage">


<div class="loginBox">


<h1>
🔥 CUSTOM TTA
</h1>


<p>
QUẢN LÝ CUSTOM FREE FIRE
</p>



<input 
id="username"
placeholder="Tên đăng nhập">



<input 
id="password"
type="password"
placeholder="Mật khẩu">



<button id="loginBtn">

ĐĂNG NHẬP

</button>



<p id="loginError"></p>


</div>


</section>









<!-- APP -->

<div id="app" class="hidden">



<header>


<div>

<h2>
🔥 CUSTOM TTA
</h2>


<span id="welcome">
Xin chào
</span>


</div>



<button id="logoutBtn">

🚪 Đăng xuất

</button>


</header>









<!-- MENU -->

<nav class="menu">


<button data-page="dashboard">

📊 Dashboard

</button>



<button data-page="register">

➕ Đăng ký

</button>



<button data-page="teams">

👥 Team

</button>



<button data-page="payments">

💸 Thanh toán

</button>



<button data-page="settings">

⚙️ Cài đặt

</button>



</nav>









<main>



<!-- DASHBOARD -->

<section id="dashboard" class="page">


<h1>
📊 DASHBOARD
</h1>



<div class="cards">


<div class="card">

<h3>
Tổng Team
</h3>

<b id="totalTeam">
0
</b>

</div>



<div class="card">

<h3>
Doanh thu
</h3>

<b id="revenue">
0đ
</b>

</div>



<div class="card">

<h3>
Đã thanh toán
</h3>

<b id="paid">
0
</b>

</div>



<div class="card">

<h3>
Chưa thanh toán
</h3>

<b id="unpaid">
0
</b>

</div>


</div>


</section>









<!-- ĐĂNG KÝ -->

<section id="register" class="page hidden">


<h1>
➕ ĐĂNG KÝ TEAM
</h1>



<input 
id="teamName"
placeholder="Tên Team">



<select id="teamBox">


<option>
BOX 1
</option>


<option>
BOX 2
</option>


<option>
BOX 3
</option>


<option>
BOX 4
</option>


<option>
BOX 5
</option>


</select>





<select id="teamTime">


<option>
10H00
</option>


<option>
13H00
</option>


<option>
15H00
</option>


<option>
18H00
</option>


<option>
20H00
</option>


<option>
22H00
</option>


</select>




<button id="addTeamBtn">

🔥 THÊM TEAM

</button>



</section>









<!-- TEAM -->

<section id="teams" class="page hidden">


<h1>
👥 DANH SÁCH TEAM
</h1>



<input 
id="searchTeam"
placeholder="🔎 Tìm Team">



<div id="teamList">

</div>



</section>









<!-- THANH TOÁN -->

<section id="payments" class="page hidden">


<h1>
💸 THANH TOÁN
</h1>



<div id="paymentList">

</div>



</section>









<!-- CÀI ĐẶT -->

<section id="settings" class="page hidden">


<h1>
⚙️ CÀI ĐẶT
</h1>



<button id="backupBtn">

💾 Backup

</button>



<button id="resetBtn">

🔄 Reset

</button>



</section>







</main>





<div id="toast">

</div>



</div>









<!-- JAVASCRIPT -->


<script src="notification.js"></script>

<script src="auth.js"></script>

<script src="firebase.js"></script>

<script src="app.js?v=4"></script>

<script src="export.js"></script>

<script src="backup.js"></script>

<script src="reset.js"></script>

<script src="messenger.js"></script>






<script>


window.addEventListener(
"load",
()=>{


let loading =
document.getElementById(
"loading"
);



if(loading){

setTimeout(()=>{

loading.style.display="none";


},1200);


}


});



</script>






<script>


if(
"serviceWorker" in navigator
){


navigator.serviceWorker.register(
"./service-worker.js"
)

.then(()=>{

console.log(
"🔥 CUSTOM TTA PWA READY"
);


})


.catch(err=>{

console.log(err);

});


}


</script>



</body>

</html>
