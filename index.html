<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TTA CUSTOM MANAGER</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>🔥 TTA CUSTOM MANAGER 🔥</h1>



<!-- THỐNG KÊ -->

<div class="panel">

<h2>📊 THỐNG KÊ</h2>

<p id="total">
Tổng team: 0
</p>

<p id="paidCount">
Đã thanh toán: 0
</p>

<p id="unpaidCount">
Chưa thanh toán: 0
</p>

<p id="money">
Doanh thu: 0K
</p>


</div>





<!-- ĐĂNG KÝ -->


<div class="panel">


<h2>
➕ ĐĂNG KÝ TEAM
</h2>



<input 
id="name"
placeholder="Nhập tên team"
>



<select id="box">


<option value="1">
🔥 BOX 1
</option>

<option value="2">
🔥 BOX 2
</option>

<option value="3">
🔥 BOX 3
</option>

<option value="4">
🔥 BOX 4
</option>

<option value="5">
🔥 BOX 5
</option>

<option value="6">
🔥 BOX 6
</option>

<option value="7">
🔥 BOX 7
</option>

<option value="8">
🔥 BOX 8
</option>

<option value="9">
🔥 BOX 9
</option>

<option value="10">
🔥 BOX 10
</option>


</select>





<select id="time">


<option>
⏰10H00⏰ 💸5K💸
</option>


<option>
⏰13H00⏰ 💸5K💸
</option>


<option>
⏰15H00⏰ 💸5K💸
</option>


<option>
⏰18H00⏰ 💸5K💸
</option>


<option>
⏰20H00⏰ 💸5K💸
</option>


<option>
⏰22H00⏰ 💸5K💸
</option>


<option>
⏰23H50⏰ 💸5K💸
</option>


</select>




<button id="add">

➕ THÊM TEAM

</button>



</div>







<div class="layout">





<!-- DANH SÁCH CHƯA THANH TOÁN -->


<div class="panel">


<h2>
📋 DANH SÁCH ĐĂNG KÝ
</h2>


<div id="list">

</div>


</div>







<!-- DANH SÁCH ĐÃ THANH TOÁN -->


<div class="panel">


<h2>
💰 ĐÃ THANH TOÁN
</h2>


<div id="paidList">

</div>


</div>



</div>








<!-- BẢNG THI ĐẤU COPY MESS -->


<div class="panel">


<h2>
🎮 BẢNG THI ĐẤU (COPY MESS)
</h2>


<textarea id="match" readonly>

</textarea>



<button onclick="copyMatch()">

📋 COPY BẢNG ĐẤU

</button>



</div>





</div>




<script type="module" src="app.js"></script>


</body>

</html>
