<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TTA CUSTOM MANAGER</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>🔥 TTA CUSTOM MANAGER 🔥</h1>



<div class="register">


<h2>➕ ĐĂNG KÝ TEAM</h2>


<input 
id="name"
placeholder="Nhập tên team"
>



<select id="box">

<option>🔥 BOX 1</option>
<option>🔥 BOX 2</option>
<option>🔥 BOX 3</option>
<option>🔥 BOX 4</option>
<option>🔥 BOX 5</option>
<option>🔥 BOX 6</option>
<option>🔥 BOX 7</option>
<option>🔥 BOX 8</option>
<option>🔥 BOX 9</option>
<option>🔥 BOX 10</option>

</select>




<select id="time">


<option>⏰10H00⏰ 💸5K💸</option>

<option>⏰13H00⏰ 💸5K💸</option>

<option>⏰15H00⏰ 💸5K💸</option>

<option>⏰18H00⏰ 💸5K💸</option>

<option>⏰20H00⏰ 💸5K💸</option>

<option>⏰22H00⏰ 💸5K💸</option>

<option>⏰23H50⏰ 💸5K💸</option>


</select>



<button id="add">

➕ THÊM TEAM

</button>



</div>






<div class="layout">



<div class="panel">


<h2>📋 DANH SÁCH ĐĂNG KÝ</h2>


<div id="list">

</div>


</div>





<div class="panel">


<h2>🎮 BẢNG THI ĐẤU</h2>


<div id="match">

</div>


</div>



</div>





</div>




<script type="module" src="app.js"></script>


</body>

</html>
